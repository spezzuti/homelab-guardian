[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-guardian"
version = "0.4.0"
description = "Local-first homelab health monitoring with optional AI-agent integration and approval-gated repair"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
keywords = ["homelab", "monitoring", "health-check", "self-hosted", "mcp", "docker", "systemd"]
authors = [{name = "spezzuti"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/spezzuti/homelab-guardian"
Repository = "https://github.com/spezzuti/homelab-guardian"
Changelog = "https://github.com/spezzuti/homelab-guardian/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff==0.15.5", "mypy==2.1.0"]
# Expose Guardian as an MCP server (`guardian mcp`) so any agent can read its
# structured health data. Optional so the core stays dependency-light.
mcp = ["mcp>=1.2.0"]
# The Docker collector's SDK. Optional for the same reason: the collector is
# off by default and degrades to a clear "install the extra" check without it.
docker = ["docker>=7.0.0"]

[project.scripts]
guardian = "homelab_guardian.main:main"

[tool.setuptools.packages.find]
include = ["homelab_guardian*"]

[tool.setuptools.package-data]
homelab_guardian = ["assets/*", "assets/fonts/*", "drills/catalog/*.yaml"]

[tool.bandit]
# Skips are checks that flag this project's deliberate design, not defects:
#   B404/B603 - Guardian's whole job is running argv-only subprocesses
#               (never shell=True; enforced by tests/test_repair_safety.py).
#   B607      - system tools (systemctl, docker, bws) are invoked from PATH.
#   B105/B107 - environment-variable NAMES are not hardcoded passwords.
# Anything else bandit finds fails CI. One-off false positives carry a bare
# inline `# nosec BXXX` instead of widening these skips; as of the audit that
# added this config those are: B608 (SQL built from module-constant column
# names, values always bound), B104 (comparing host to '0.0.0.0' to WARN the
# user, not a bind), B113 (requests calls that do set timeout= on a later
# line of the same call), B110 (best-effort network-readiness gate).
skips = ["B404", "B603", "B607", "B105", "B107"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Declared explicitly rather than inherited: ruff's default selection has
# changed across releases, and CI must enforce what this project chose, not
# whatever the newest ruff happens to default to.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Inline lambda runners and mid-file import sections are deliberate test idiom.
"tests/*" = ["E731", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Permissive baseline: catch real type errors in annotated code without
# demanding annotations everywhere. Tighten over time.
check_untyped_defs = false
