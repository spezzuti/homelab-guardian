[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-guardian"
version = "0.3.5"
description = "Local-first homelab health monitoring with optional AI-agent integration and approval-gated repair"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
keywords = ["homelab", "monitoring", "health-check", "self-hosted", "mcp", "docker", "systemd"]
authors = [{name = "spezzuti"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/spezzuti/homelab-guardian"
Repository = "https://github.com/spezzuti/homelab-guardian"
Changelog = "https://github.com/spezzuti/homelab-guardian/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff", "mypy"]
# Expose Guardian as an MCP server (`guardian mcp`) so any agent can read its
# structured health data. Optional so the core stays dependency-light.
mcp = ["mcp>=1.2.0"]
# The Docker collector's SDK. Optional for the same reason: the collector is
# off by default and degrades to a clear "install the extra" check without it.
docker = ["docker>=7.0.0"]

[project.scripts]
guardian = "homelab_guardian.main:main"

[tool.setuptools.packages.find]
include = ["homelab_guardian*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Inline lambda runners and mid-file import sections are deliberate test idiom.
"tests/*" = ["E731", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Permissive baseline: catch real type errors in annotated code without
# demanding annotations everywhere. Tighten over time.
check_untyped_defs = false
