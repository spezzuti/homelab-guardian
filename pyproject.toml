[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-guardian"
version = "0.2.0"
description = "Local-first, read-only homelab health reports in plain English"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Expose Guardian as an MCP server (`guardian mcp`) so any agent can read its
# structured health data. Optional so the core stays dependency-light.
mcp = ["mcp>=1.2.0"]

[project.scripts]
guardian = "homelab_guardian.main:main"

[tool.setuptools.packages.find]
include = ["homelab_guardian*"]
