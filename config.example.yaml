app:
  name: Homelab Guardian
  # Generated reports are runtime output and are ignored by Git.
  report_path: reports/latest.md
  # Local SQLite snapshots are runtime output and are ignored by Git.
  database_path: data/guardian.sqlite
  # Scan snapshots older than this are pruned automatically. 0 disables pruning.
  retention_days: 60
  # Gate ONLY the first scan after startup on network readiness, so a reboot's
  # scan-before-DNS doesn't flip every network/TLS check to a false warning.
  # Later scans run ungated (a real outage must surface). Probe hosts are
  # auto-derived from the network collector's checks; override with `hosts:`.
  network_ready:
    enabled: true
    # hosts: [example.com]      # optional explicit probe hosts
    timeout_seconds: 120        # give up waiting after this and scan anyway
    interval_seconds: 3         # retry probe this often while waiting

collectors:
  docker:
    # Disabled by default because Docker socket access is sensitive.
    # This collector only works where the Docker socket is available.
    # Direct host mode: run on a Docker host with /var/run/docker.sock.
    # Container mode: intentionally mount /var/run/docker.sock into the Guardian container.
    # Socket-proxy mode: docker-compose.socket-proxy.yml sets DOCKER_HOST,
    # which takes precedence over socket_url.
    enabled: false
    socket_url: unix:///var/run/docker.sock
    # Exclude Guardian's own short-lived runtime containers from health reports.
    # This keeps one-shot Docker Compose runs from reporting themselves as extra workload.
    # Docker Compose container names in this setup normally use hyphens.
    exclude_containers:
      - "homelab-guardian*"

  homeassistant:
    # Read-only API collection. Requires:
    # 1. Home Assistant URL reachable from the machine/container running Guardian.
    # 2. A long-lived access token exposed through token_env.
    # Do not put the token in this YAML file.
    enabled: false
    url: "http://homeassistant.local:8123"
    token_env: "HOMEASSISTANT_TOKEN"

  network:
    enabled: true
    dns_checks:
      - id: dns_example_public
        name: Public DNS sanity check
        hostname: example.com
        record_type: A/AAAA
    tcp_checks:
      - id: tcp_example_https
        name: Example HTTPS TCP reachability
        host: example.com
        port: 443
        timeout: 3
    http_checks:
      - id: http_example
        name: Example HTTP status check
        url: https://example.com
        expected_status: [200]
        timeout: 5
        # Optional: roll this check up under a named heading in the dashboard.
        # Give a service's reachability and certificate checks the SAME group
        # (e.g. "Core services") and they collapse together under one tile.
        # group: Core services
        # Set verify_tls: false for services with self-signed certificates
        # (Proxmox, TrueNAS, iDRAC, etc.). The check still proves the service
        # answers HTTPS; it just skips certificate-chain validation.
        # verify_tls: false
    # Certificate expiry monitoring. Works for self-signed certificates too.
    # tls_checks:
    #   - id: tls_reverse_proxy
    #     name: Reverse proxy certificate
    #     host: example.com
    #     port: 443
    #     warn_days: 14      # warning below this many days left
    #     critical_days: 3   # critical below this many days left

  systemd:
    # Read-only systemd inspection on Linux hosts. Sweeps every service for
    # failures AND restart loops (a unit stuck in auto-restart never reaches
    # "failed", so failure checks alone miss it). Run Guardian directly on
    # the host for this collector; a container cannot see the host's systemd.
    enabled: false
    # Also sweep the per-user service manager (systemctl --user).
    include_user: false
    # Optionally watch specific units closely (state + restart counts):
    # units:
    #   - unit: nginx.service
    #   - unit: my-backup.service
    #     required: false        # warning instead of critical when stopped
    #   - unit: my-bot.service
    #     user: true             # a user-bus unit
    units: []

  disks:
    # Disk-full is the most common silent homelab failure. Reads usage on the
    # configured mounts; with paths empty, watches the drive Guardian runs on.
    enabled: true
    paths: []
    # paths:
    #   - path: /
    #     warn_percent: 85
    #     critical_percent: 95
    #   - path: /mnt/media
    #     name: Media pool

  mounts:
    # Verify NAS/NFS/CIFS mountpoints are actually mounted (a dropped share is
    # silent — the mountpoint dir still exists, so a disk check stays green).
    # Read-only via os.path.ismount. Pairs with the `remount` repair playbook.
    enabled: false
    mounts: []
    # mounts:
    #   - path: /mnt/truenas-backup
    #   - { path: /mnt/media, required: false }

  backups:
    enabled: true
    # Backup paths are local to the machine/container running Guardian.
    # If Guardian runs in Docker, mount backup locations into the container read-only.
    # Backup freshness for a directory is based on the newest file inside it.
    # Directory modified times are ignored because they can be misleading.
    # Example:
    # paths:
    #   - id: nightly_nas_backup
    #     name: Nightly NAS backup
    #     path: /mnt/backups/nightly
    #     max_age_days: 2
    #     required: true
    paths: []

  # --- Host hardening collectors (Linux hosts; run Guardian on the host) ---

  firewall:
    # Is a host firewall active and does it default to denying inbound?
    # Reads service state and the world-readable ufw config files; no root.
    enabled: false

  exposed_services:
    # Names services listening on a non-loopback address, flagging sensitive
    # ones (SMB, VNC, databases, ...). Reads `ss` only.
    enabled: false
    # Ports you have intentionally exposed to the LAN (silences the warning):
    # allow_ports: [445]
    # Extra ports to treat as sensitive (port: label):
    # sensitive_ports:
    #   8086: InfluxDB

  ssh:
    # Reads the effective sshd config (first-match-wins, drop-ins included) and
    # warns on password authentication or direct root login. Needs no root.
    enabled: false

  updates:
    # Pending updates, pending SECURITY updates, and whether a reboot is
    # required to finish applying them. apt-based hosts only for now.
    enabled: false

  backup_health:
    # Watches the backup JOB, not just a directory: is there a recent snapshot?
    enabled: false
    # repos:
    #   # restic mode — authoritative snapshot age (needs the repo password):
    #   - id: nas_restic
    #     name: NAS restic backup
    #     tool: restic
    #     repository: /mnt/backup/restic
    #     password_file: /root/.config/restic/password
    #     # password_env: RESTIC_PASSWORD   # alternative to password_file
    #     max_age_hours: 36       # warning beyond this
    #     critical_age_hours: 108 # critical beyond this (default: 3x warn)
    #   # systemd mode — credential-free; checks a backup unit's last run:
    #   - id: nightly_backup_job
    #     name: Nightly backup job
    #     tool: systemd
    #     unit: my-backup.service
    #     max_age_hours: 36
    repos: []

web:
  # Authentication for the `guardian serve` dashboard. /healthz stays open for
  # uptime monitors. Pick the mechanism that fits your setup — options are the
  # point. Default is "none" (open, the historical behaviour).
  auth:
    mode: none   # none | basic | forward_auth | oidc

    # --- mode: basic --- built-in username/password (easiest; use over HTTPS/LAN)
    # mode: basic
    # username: admin
    # password_env: GUARDIAN_WEB_PASSWORD   # preferred: set in .env, never here
    # password: ""                          # plaintext fallback (discouraged)

    # --- mode: forward_auth --- trust identity headers from an upstream proxy.
    # ONE mode covers Authelia, Authentik, oauth2-proxy, Traefik/Caddy/nginx
    # auth_request, Cloudflare Access, ... Headers are trusted ONLY from a
    # source IP in trusted_proxies, so they can't be spoofed by direct hits.
    # mode: forward_auth
    # forward_auth is read from these keys at the web.auth level:
    # trusted_proxies: ["127.0.0.1", "::1"]   # the proxy's source IP(s)/CIDRs
    # user_header: Remote-User                # Authelia/Authentik default
    # email_header: Remote-Email
    # groups_header: Remote-Groups
    # required_groups: []                     # optional allow-list of groups

    # --- mode: oidc --- native OpenID Connect login (Authentik, Keycloak,
    # Zitadel, ... any OIDC provider). Authorization-code flow with PKCE; the
    # id_token is obtained over a direct back-channel TLS call to the issuer.
    # mode: oidc
    # issuer: "https://auth.example.com/application/o/guardian/"
    # client_id: "homelab-guardian"
    # client_secret_env: GUARDIAN_OIDC_CLIENT_SECRET
    # redirect_url: "http://192.168.0.77:8674/auth/callback"  # must match the IdP
    # required_groups: []        # optional; requires the IdP to send a groups claim
    # cookie_secure: false       # set true when served over HTTPS

secrets:
  # Where Guardian looks up named secrets (tokens, API keys, chat ids).
  # Every *_env setting in this file names a secret; the provider decides
  # where that name is resolved.
  #
  #   env       (default) — read from environment variables only.
  #   bitwarden — read from Bitwarden Secrets Manager via the bws CLI,
  #               with environment variables still taking precedence.
  #               One machine-account access token (BWS_ACCESS_TOKEN in the
  #               environment) replaces every individual token env var, and
  #               your secret keys in Bitwarden simply match the names below
  #               (HASS_TOKEN, TELEGRAM_BOT_TOKEN, ...).
  provider: env
  bitwarden:
    access_token_env: "BWS_ACCESS_TOKEN"
    # Optional: restrict to one Secrets Manager project id.
    project_id: ""
    # Secrets are fetched once per cache window, not on every lookup.
    cache_seconds: 300
    # Path to the bws binary if it is not on PATH.
    bws_path: "bws"

ai:
  # Optional bring-your-own-model explanation layer. When enabled, Guardian
  # sends ONLY the structured check results and diff to one OpenAI-compatible
  # chat completions endpoint and puts the returned plain-English briefing at
  # the top of the report. The model has no shell, no tools, and no access to
  # your systems. Guardian works fully with this disabled.
  #
  # Examples:
  #   OpenRouter:  base_url: "https://openrouter.ai/api/v1"
  #                model: "anthropic/claude-haiku-4.5"
  #   Local Ollama: base_url: "http://localhost:11434/v1"
  #                 model: "qwen3:14b"   # no API key needed
  enabled: false
  base_url: ""
  model: ""
  # Name of the environment variable holding the API key (leave the variable
  # unset for local endpoints that need no key). Never put keys in this file.
  api_key_env: "GUARDIAN_AI_API_KEY"

mcp:
  # The `guardian mcp` server exposes Guardian's health data to an AI agent over
  # the Model Context Protocol. Read tools (get_health_summary, list_problems,
  # list_checks, get_check, get_recent_changes, list_scan_history,
  # list_acknowledgments) are always available.
  #
  # allow_writes adds the two WRITE tools acknowledge_check / unacknowledge_check
  # so the agent can mute/un-mute a check on your behalf (e.g. you tell the agent
  # "silence that disk warning for a week"). It is the same mute the `guardian
  # ack` CLI performs — reversible, and excluded from overall status + alerts.
  # Off by default: with it false the write tools are not even registered, so an
  # attached agent cannot change Guardian's state.
  allow_writes: false
  # Optional HTTP transport for a REMOTE agent (stdio stays the default for a
  # same-host agent). `guardian mcp --http` serves streamable HTTP and REQUIRES a
  # bearer token (it refuses to start without one) so the network surface is never
  # unauthenticated. Clients send `Authorization: Bearer <token>`. For SSO/OIDC,
  # front it with a reverse proxy. Default bind 127.0.0.1:8675.
  http:
    token_env: ""             # env/secret name holding the bearer token, e.g. GUARDIAN_MCP_TOKEN

repair:
  # Approval-gated repair playbooks (see docs/repair.md). OFF by default and a
  # separate, stronger gate than mcp.allow_writes. With enabled: false no repair
  # can run and the repair MCP tools are not registered. Guardian only ever runs
  # named, whitelisted, parameterized actions — never raw shell — and only after
  # a human approves the specific proposal (CLI: `guardian repair approve <id>`).
  enabled: false
  require_approval: true        # human approval required (auto_approve below opts out per-action)
  playbooks:
    restart_systemd_unit:
      enabled: false
      # Only units listed here can be restarted. Keep it to a blessed subset of
      # the units the systemd collector watches. The unit to restart is read from
      # the failing check's evidence, then checked against this list.
      allowed_units: []         # e.g. [marcus-backup.service]
      # auto_approve: true makes this a self-healing reflex — on a CONFIRMED
      # critical (flap-damped), Guardian auto-proposes, executes, and verifies
      # the repair with no human in the loop (still loop-guarded + audited).
      # Destructive actions ignore this and always need human approval.
      auto_approve: false
      max_attempts_per_hour: 3  # loop guard: after this, Guardian escalates to you instead of restarting again
      timeout: 60
    restart_container:
      enabled: false
      # Only containers named here can be restarted. The container name is read
      # from the failing docker_container_* check's evidence, then checked here.
      allowed_containers: []    # e.g. [jellyfin, ersatztv]
      use_sudo: false           # true → `sudo -n docker restart <name>` (scoped sudoers) if your user can't reach the Docker socket directly
      auto_approve: false
      max_attempts_per_hour: 3
    remount:
      # Re-mount a dropped mount (from the mounts collector) via `sudo -n mount
      # <path>` (needs a scoped sudoers grant). The path is read from the failing
      # mount_* check's evidence, then checked against allowed_mounts.
      enabled: false
      allowed_mounts: []        # e.g. [/mnt/truenas-backup]
      auto_approve: false
      max_attempts_per_hour: 3
      timeout: 60
    # Disk-reclaim playbooks (see docs/repair-reclaim.md). Each applies to a
    # FAILING disk_* check and carries a read-only preview of what it would free.
    # docker_prune is risk:destructive and can never be auto-approved.
    docker_prune:
      enabled: false            # `docker system prune -f` (NOT volumes unless allow_volumes)
      allow_volumes: false      # true also removes named volumes — that is data; leave off
      auto_approve: false       # ignored for destructive actions even if set true
      max_attempts_per_hour: 2
      timeout: 120
    journal_vacuum:
      enabled: false            # `sudo -n journalctl --vacuum-size=<vacuum_size>` (needs scoped sudoers)
      vacuum_size: "200M"
      auto_approve: false
      max_attempts_per_hour: 2
    apt_clean:
      enabled: false            # `sudo -n apt-get clean` (needs scoped sudoers); harmless, re-downloadable
      auto_approve: false
      max_attempts_per_hour: 2
    prune_dir:
      # Deletes USER files older than older_than_days under allowed_paths ONLY.
      # risk:destructive (never auto-approves). Carries the backup interlock:
      # a not-ok Backups check hard-refuses; with no Backups check it warns and
      # allows unless require_fresh_backup is true.
      enabled: false
      allowed_paths: []         # e.g. [/srv/downloads/tmp] — never derived from input
      older_than_days: 14       # floored at 1; deletes files older than this
      require_fresh_backup: false   # true → refuse unless a healthy Backups check exists
      # require_fresh_backup_hours: 24  # when a Backups check IS present, also require
                                        # its snapshot age (evidence.age_hours) within this
                                        # window — an ok-but-stale backup is refused
      auto_approve: false
      max_attempts_per_hour: 2
      timeout: 120
  # Optional: require re-typing the proposal id to execute a destructive repair
  # (off by default — a single human approval is enough, like Claude Code).
  require_typed_confirmation: false

notifications:
  # Delivery mode:
  #   direct — Guardian messages you over Telegram itself (standalone, no AI).
  #   agent  — Guardian hands each confirmed change to an attached AI agent's
  #            webhook (below) so the AGENT is the single voice: it reports the
  #            change and offers to fix it. In agent mode Telegram is dormant,
  #            used only as the critical-fallback (see notifications.agent).
  mode: direct
  telegram:
    # Optional. Sends a short summary message after each scan.
    # The bot token and chat id come from environment variables; never put
    # them in this file. Create a bot with @BotFather, then message the bot
    # once so it can reach your chat.
    enabled: false
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    # When to send: always | changes | problems
    #   always   — every scan
    #   changes  — when a confirmed failure or recovery transition happened
    #   problems — only when a confirmed failure transition happened
    send_on: changes
    # Flap damping: a status must hold for this many consecutive scans before
    # it is announced. 1 = immediate. 2 is recommended once scans run on a
    # schedule — one network blip will no longer page you.
    confirm_scans: 1
  # Used only when mode: agent. Guardian POSTs the same flap-damped, confirmed
  # transitions (enriched with each check's evidence + recommended_action) to
  # the agent's intake webhook as a structured JSON event — Guardian decides
  # WHAT is alert-worthy; the agent decides how to tell you and offers to fix.
  agent:
    enabled: false
    webhook_url: ""              # the agent's inbound webhook (e.g. a hermes webhook route)
    # Auth — two interchangeable styles, pick what your receiver expects:
    #  (a) HMAC (GitHub-style; what hermes webhooks verify). The per-route
    #      secret signs the body as X-Hub-Signature-256: sha256=<hmac>.
    # hmac_secret_env: "GUARDIAN_WEBHOOK_SECRET"
    # event_type: "guardian.health_change"   # sent as X-GitHub-Event
    #  (b) Bearer/header token, resolved from env/secrets.
    # token_env: "GUARDIAN_AGENT_WEBHOOK_TOKEN"
    # auth_header: "Authorization"   # default
    # auth_scheme: "Bearer"          # default; set "" to send the raw token
    send_on: changes             # same semantics as telegram.send_on
    # If a CRITICAL can't be delivered to the agent (it's down/unreachable),
    # send it to you directly over the Telegram config above (same shared bot),
    # labeled so it doubles as an agent-down signal. Keeps a down agent from
    # silently swallowing a critical. Set false to opt out.
    critical_fallback: true
    # Fail-to-ACK window: after a critical is delivered to the agent, it must
    # confirm it relayed it (the acknowledge_alert_received MCP tool) within this
    # many minutes — otherwise Guardian sends the critical over Telegram itself.
    # Catches "agent accepted it but never told me" (vs. critical_fallback above,
    # which catches "agent was unreachable"). Needs the agent wired to call back.
    ack_timeout_minutes: 10
