name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token or repo secret.
# The trusted publisher on pypi.org is bound to spezzuti/homelab-guardian +
# publish.yml + the `pypi` environment. Manual-only: push the release tag,
# then run this from the Actions tab. skip-existing tolerates re-runs where
# some files already uploaded (a duplicate version is skipped, not an error).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
