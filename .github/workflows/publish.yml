name: Publish to PyPI

# Releases are published with `twine` using the PyPI API token (PYPI_PASSWORD in
# the homelab vault). Trusted Publishing (OIDC) was tried but the pending-
# publisher handshake never matched, so this workflow is MANUAL-ONLY (no
# tag-trigger) to avoid failing runs — run it from the Actions tab after adding
# the repo secret `PYPI_API_TOKEN` (your pypi-... token). Until then, publish
# locally:  python -m build  &&  TWINE_USERNAME=__token__ TWINE_PASSWORD=<token> twine upload dist/*

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
