name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the others — platform-specific
      # bugs (e.g. a Windows-only socket reset) must surface, not hide behind a
      # cancelled Linux run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      - name: Smoke-test example config scan
        run: python -m homelab_guardian.main --config config.example.yaml
