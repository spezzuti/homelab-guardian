name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same pinned versions the tests use, so lint can't break on an
      # upstream release with no change to this repo.
      - run: pip install -r requirements-dev.txt
      - run: ruff check homelab_guardian tests
      - run: mypy homelab_guardian

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]" pip-audit
      - name: Static security scan
        run: bandit -c pyproject.toml -r homelab_guardian
      - name: Audit runtime dependencies for known CVEs
        run: pip-audit .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the others — platform-specific
      # bugs (e.g. a Windows-only socket reset) must surface, not hide behind a
      # cancelled Linux run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      - name: Smoke-test example config scan
        run: python -m homelab_guardian.main --config config.example.yaml
