services:
  homelab-guardian:
    # Prebuilt images are published for amd64/arm64; `docker compose build`
    # still works for local development.
    build: .
    image: ghcr.io/spezzuti/homelab-guardian:latest
    command: python -m homelab_guardian.main --config /app/config.yaml
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/New_York
      HOMEASSISTANT_TOKEN: ${HOMEASSISTANT_TOKEN:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./reports:/app/reports
      # Direct Docker socket mode. Sensitive even when mounted read-only.
      # Guardian only performs read operations, but Docker socket access is powerful.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: "no"
