services:
  homelab-guardian:
    build: .
    image: homelab-guardian:local
    command: python -m app.main --config /app/config.yaml
    environment:
      TZ: America/New_York
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./reports:/app/reports
      # Direct Docker socket mode. Sensitive even when mounted read-only.
      # Guardian only performs read operations, but Docker socket access is powerful.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: "no"
